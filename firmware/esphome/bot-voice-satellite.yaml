# BOT Voice Satellite - ESPHome Configuration
# ============================================
# This configures the ESP32-S3-BOX as a voice input device for BOT.
# 
# Setup:
# 1. Copy this file to your ESPHome directory
# 2. Create a secrets.yaml with your WiFi credentials
# 3. Flash to your ESP32-S3-BOX
#
# For ESP32-S3-BOX-3, you may need to adjust pin numbers.

esphome:
  name: bot-voice-satellite
  friendly_name: BOT Voice
  comment: "Voice satellite for the BOT project - designed by Agatha!"
  
  # Platform-specific configuration
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

# =============================================================================
# NETWORK CONFIGURATION
# =============================================================================
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Enable fallback hotspot for initial setup
  ap:
    ssid: "BOT-Voice-Setup"
    password: "setupbot123"

# Enable captive portal for fallback configuration
captive_portal:

# =============================================================================
# LOGGING AND API
# =============================================================================
logger:
  level: DEBUG
  logs:
    sensor: WARN  # Reduce sensor spam

api:
  encryption:
    key: !secret api_encryption_key
  
  # Services that can be called from Home Assistant
  services:
    - service: start_listening
      then:
        - voice_assistant.start:
    - service: stop_listening
      then:
        - voice_assistant.stop:

ota:
  platform: esphome
  password: !secret ota_password

# =============================================================================
# AUDIO HARDWARE - ESP32-S3-BOX
# =============================================================================

# I2S Audio Bus
i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO45  # Word Select
    i2s_bclk_pin: GPIO17   # Bit Clock

# Microphone Input
microphone:
  - platform: i2s_audio
    id: box_mic
    adc_type: external
    i2s_din_pin: GPIO16
    pdm: false
    channel: left
    bits_per_sample: 32bit
    i2s_audio_id: i2s_audio_bus

# Speaker Output
speaker:
  - platform: i2s_audio
    id: box_speaker
    i2s_dout_pin: GPIO15
    dac_type: external
    i2s_audio_id: i2s_audio_bus
    mode: mono

# =============================================================================
# VOICE ASSISTANT CONFIGURATION
# =============================================================================
voice_assistant:
  id: voice_assistant_id
  microphone: box_mic
  speaker: box_speaker
  use_wake_word: true
  
  # Audio processing
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  
  # Event handlers for visual/audio feedback
  on_wake_word_detected:
    - logger.log: "Wake word detected! BOT is listening..."
    - light.turn_on:
        id: led_indicator
        brightness: 100%
        red: 0%
        green: 0%
        blue: 100%  # Blue = listening
    - script.execute: play_listening_sound

  on_stt_vad_start:
    - logger.log: "Voice activity detected, recording..."

  on_stt_vad_end:
    - logger.log: "Voice activity ended, processing..."
    - light.turn_on:
        id: led_indicator
        brightness: 100%
        red: 100%
        green: 100%
        blue: 0%  # Yellow = thinking
        effect: "pulse"

  on_stt_end:
    - logger.log: 
        format: "Speech recognized: %s"
        args: ['x.c_str()']

  on_tts_start:
    - logger.log: "BOT is responding..."
    - light.turn_on:
        id: led_indicator
        brightness: 100%
        red: 0%
        green: 100%
        blue: 0%  # Green = speaking

  on_tts_end:
    - logger.log: "Response complete"

  on_end:
    - logger.log: "Conversation ended"
    - delay: 500ms
    - light.turn_off: led_indicator
    
  on_error:
    - logger.log:
        format: "Voice assistant error: %s"
        args: ['code']
    - light.turn_on:
        id: led_indicator
        brightness: 100%
        red: 100%
        green: 0%
        blue: 0%  # Red = error
    - delay: 2s
    - light.turn_off: led_indicator

# =============================================================================
# WAKE WORD DETECTION
# =============================================================================
micro_wake_word:
  models:
    # Start with "okay nabu" - can train custom "hey bot" later
    - model: okay_nabu
  on_wake_word_detected:
    - logger.log: 
        format: "Wake word '%s' detected!"
        args: ['wake_word']

# =============================================================================
# LED INDICATOR
# =============================================================================
light:
  - platform: esp32_rmt_led_strip
    id: led_indicator
    name: "BOT Status LED"
    pin: GPIO39
    num_leds: 1
    rmt_channel: 0
    chipset: SK6812
    rgb_order: GRB
    effects:
      - pulse:
          name: "pulse"
          transition_length: 500ms
          update_interval: 500ms
          min_brightness: 30%
          max_brightness: 100%

# =============================================================================
# PHYSICAL BUTTONS
# =============================================================================
binary_sensor:
  - platform: gpio
    id: mute_button
    name: "Mute Button"
    pin:
      number: GPIO1
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - logger.log: "Mute button pressed"
      - switch.toggle: voice_assistant_mute
      
  - platform: gpio
    id: boot_button
    name: "Boot Button"
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    on_multi_click:
      - timing:
          - ON for at most 1s
          - OFF for at least 0.5s
        then:
          - logger.log: "Manual wake trigger"
          - voice_assistant.start:

# =============================================================================
# SWITCHES
# =============================================================================
switch:
  - platform: template
    id: voice_assistant_mute
    name: "Voice Assistant Mute"
    optimistic: true
    on_turn_on:
      - logger.log: "BOT muted"
      - micro_wake_word.stop:
      - light.turn_on:
          id: led_indicator
          red: 100%
          green: 50%
          blue: 0%
    on_turn_off:
      - logger.log: "BOT unmuted"
      - micro_wake_word.start:
      - light.turn_off: led_indicator

# =============================================================================
# SCRIPTS
# =============================================================================
script:
  - id: play_listening_sound
    then:
      - logger.log: "Playing listening acknowledgment"
      # TODO: Add actual sound playback when supported

# =============================================================================
# DIAGNOSTIC SENSORS
# =============================================================================
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    
  - platform: uptime
    name: "Uptime"
    
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
